// Enable our per-project features here

// Enable GPIO drivers
CONFIG_GPIO=y

// Enable console and logging drivers
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y

// Enable UART drivers
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

// Enable I2C drivers
CONFIG_I2C=y

// Enable multithreading
CONFIG_MULTITHREADING=y